<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إتمام الطلب</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
}

.box{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 0 5px #ccc;
}

h2{
text-align:center;
color:#198754;
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#198754;
color:#fff;
border:0;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>📦 إتمام الطلب</h2>

<input id="name" placeholder="الاسم الكامل">

<input id="phone" placeholder="رقم الجوال">

<select id="city">
<option value="">اختر المدينة</option>
<option>الرياض</option>
<option>جدة</option>
<option>مكة</option>
<option>الدمام</option>
</select>

<textarea id="address" placeholder="العنوان بالتفصيل"></textarea>

<button id="sendOrder">
تأكيد الطلب
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {

apiKey:"AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",

authDomain:"rehlattejarah.firebaseapp.com",

projectId:"rehlattejarah",

storageBucket:"rehlattejarah.firebasestorage.app",

messagingSenderId:"56157415045",

appId:"1:56157415045:web:d1c496a5cdc4d5f81e2bec"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("sendOrder").addEventListener("click", async ()=>{

const name=document.getElementById("name").value.trim();
const phone=document.getElementById("phone").value.trim();
const city=document.getElementById("city").value;
const address=document.getElementById("address").value.trim();

if(!name || !phone || !city || !address){

alert("يرجى تعبئة جميع البيانات");
return;

}

const cart=JSON.parse(localStorage.getItem("cart"))||[];

if(cart.length===0){

alert("السلة فارغة");
return;

}

let total=0;

cart.forEach(p=>{
total+=Number(p.price)*(p.qty||1);
});

if(total<100){

alert("الحد الأدنى للطلب هو 100 ريال");
return;

}

const orderNo="SM-"+Date.now();
try{

await addDoc(collection(db,"orders"),{

orderNo:orderNo,

name:name,

phone:phone,

city:city,

address:address,

products:cart,

total:total,

status:"تم استلام الطلب",

createdAt:new Date().toISOString()

});

let message=`🛒 طلب جديد - سوق مباشر

🔢 رقم الطلب: ${orderNo}

👤 الاسم: ${name}

📱 الجوال: ${phone}

🏙️ المدينة: ${city}

📍 العنوان: ${address}

🛍️ المنتجات:
`;

cart.forEach(p=>{

message+=`
• ${p.name}
الكمية: ${p.qty||1}
السعر: ${p.price} ريال
`;

});

message+=`

💰 الإجمالي: ${total} ريال
`;

const adminPhone="966550496391";

const whatsappUrl=
`https://wa.me/${adminPhone}?text=${encodeURIComponent(message)}`;

localStorage.setItem("lastOrder",orderNo);

localStorage.removeItem("cart");

window.location.href=whatsappUrl;
}catch(error){

console.error(error);

alert("حدث خطأ أثناء حفظ الطلب:\n" + error.message);

}

});

</script>

</body>

</html
