<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إدارة المنتجات</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
}

.box{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
}

input,select,button{
width:100%;
padding:10px;
margin:8px 0;
}

button{
cursor:pointer;
}

.item{
border:1px solid #ddd;
padding:10px;
margin-top:10px;
}

img{
width:100px;
height:100px;
object-fit:cover;
}

#admin{
display:none;
}

</style>

</head>

<body>


<div class="box">


<div id="login">

<h2>دخول الإدارة</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل الدخول</button>

<p id="msg"></p>

</div>



<div id="admin">

<h2>لوحة إدارة سوق مباشر</h2>

<button id="logout">تسجيل الخروج</button>

<input id="name" placeholder="اسم المنتج">

<input id="price" type="number" placeholder="السعر">

<input id="city" placeholder="المدينة">

<input id="qty" placeholder="الكمية">

<input id="image" placeholder="رابط الصورة">


<select id="category">

<option value="">اختر القسم</option>

<option>مواد غذائية</option>

<option>خضروات وفواكه</option>

<option>زيوت</option>

<option>عطور</option>

<option>أخرى</option>

</select>


<button id="save">حفظ المنتج</button>


<div id="products"></div>


</div>


</div>
<script type="module">

import {db,auth} from "./firebase.js";

import {
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const productsRef = collection(db,"products");

let editId = null;


const $ = (id)=>document.getElementById(id);



// تسجيل الدخول

$("loginBtn").onclick = async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("email").value,
$("password").value
);

$("msg").innerHTML="تم الدخول بنجاح";


}catch(error){

$("msg").innerHTML="خطأ في البريد أو كلمة المرور";

}

};



// متابعة حالة الدخول

onAuthStateChanged(auth,(user)=>{

if(user){

$("login").style.display="none";

$("admin").style.display="block";

loadProducts();


}else{


$("login").style.display="block";

$("admin").style.display="none";


}

});



// تسجيل الخروج

$("logout").onclick=()=>{

signOut(auth);

};



// عرض المنتجات

async function loadProducts(){


const box=$("products");

box.innerHTML="";


const snap=await getDocs(productsRef);



snap.forEach((item)=>{


const p=item.data();



const div=document.createElement("div");

div.className="item";


div.innerHTML=`

<img src="${p.image || ""}">

<h3>${p.name || ""}</h3>

<p>السعر: ${p.price || 0} ريال</p>

<p>المدينة: ${p.city || ""}</p>

<p>الكمية: ${p["الكميه"] || ""}</p>

<button class="edit">تعديل</button>

<button class="delete">حذف</button>

`;



div.querySelector(".edit").onclick=()=>{


editId=item.id;


$("name").value=p.name || "";

$("price").value=p.price || "";

$("city").value=p.city || "";

$("qty").value=p["الكميه"] || "";

$("image").value=p.image || "";

$("category").value=p.category || "";


};



div.querySelector(".delete").onclick=async()=>{


if(confirm("هل تريد حذف المنتج؟")){


await deleteDoc(doc(db,"products",item.id));


loadProducts();


}


};


box.appendChild(div);

// حفظ المنتج

$("save").onclick = async()=>{


const data = {

name: $("name").value,

price: Number($("price").value),

city: $("city").value,

category: $("category").value,

image: $("image").value,

"الكميه": $("qty").value

};



if(editId){


await updateDoc(

doc(db,"products",editId),

data

);


editId=null;


}else{


await addDoc(

productsRef,

data

);


}



// تنظيف الحقول

$("name").value="";

$("price").value="";

$("city").value="";

$("qty").value="";

$("image").value="";

$("category").value="";



loadProducts();


};


</script>


</body>

</html>
});


}
