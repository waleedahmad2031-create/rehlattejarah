<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>إدارة سوق مباشر</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

input,
select,
button{
width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
}

button{
background:#198754;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#157347;
}

.product{
border:1px solid #ddd;
padding:10px;
margin-top:10px;
border-radius:10px;
}

.product img{
width:100%;
max-height:220px;
object-fit:contain;
margin-bottom:10px;
}

#adminBox{
display:none;
}

.offer{
color:red;
font-weight:bold;
font-size:18px;
}

.old{
text-decoration:line-through;
color:#777;
}

</style>

</head>

<body>

<div class="container">

<div id="loginBox">

<h2>🔐 دخول الإدارة</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">
دخول
</button>

</div>

<div id="adminBox">

<h2>إدارة المنتجات</h2>

<input id="name" placeholder="اسم المنتج">

<input id="price" type="number" placeholder="السعر الحالي">

<input id="oldPrice" type="number" placeholder="السعر قبل الخصم">

<select id="discount">

<option value="0">بدون عرض</option>

<option value="20">🔥 خصم 20%</option>

<option value="30">🔥 خصم 30%</option>

</select>

<input id="city" placeholder="المدينة">

<select id="category">

<option value="الكتب - المنتجات المكتبية - الألعاب - الأم والطفل">
📚 الكتب - المنتجات المكتبية - الألعاب - الأم والطفل
</option>

<option value="أدوات الحدائق - تحسين المنزل - السيارات">
🏡 أدوات الحدائق - تحسين المنزل - السيارات
</option>

<option value="الإلكترونيات">
💻 الإلكترونيات
</option>

<option value="الأحذية - الحقائب">
👟 الأحذية - الحقائب
</option>

<option value="الإكسسوارات - الساعات - النظارات">
⌚ الإكسسوارات - الساعات - النظارات
</option>

<option value="المنسوجات">
🧵 المنسوجات
</option>

<option value="مستحضرات التجميل - الجمال - العناية الشخصية">
💄 مستحضرات التجميل - الجمال - العناية الشخصية
</option>

<option value="الأثاث">
🛋️ الأثاث
</option>

<option value="السوبرماركت - الخضروات">
🛒 السوبرماركت - الخضروات
</option>

<option value="المنسوجات المنزلية - الزينة - المطبخ">
🏠 المنسوجات المنزلية - الزينة - المطبخ
</option>

</select>

<input id="image" placeholder="رابط الصورة">

<input id="qty" type="number" placeholder="الكمية">
  <button id="saveBtn">
💾 حفظ المنتج
</button>

<button id="logoutBtn">
🚪 تسجيل الخروج
</button>

<h2>📦 المنتجات</h2>

<div id="products"></div>

<hr style="margin:25px 0;">

<h2>📋 الطلبات</h2>

<div id="orders">
جاري تحميل الطلبات...
</div>

</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
collection,
addDoc,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const $ = id => document.getElementById(id);

const productsRef = collection(db,"products");

$("loginBtn").onclick = async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("email").value,
$("password").value
);

}catch(error){

alert(error.message);

}

};

$("logoutBtn").onclick=()=>{

signOut(auth);

};

onAuthStateChanged(auth,user=>{

if(user){

$("loginBox").style.display="none";

$("adminBox").style.display="block";

loadProducts();

}else{

$("loginBox").style.display="block";

$("adminBox").style.display="none";
  

}

});
  
  $("saveBtn").onclick = async()=>{

const oldPrice = Number($("oldPrice").value) || 0;
const discount = Number($("discount").value);

let finalPrice = Number($("price").value);

if(discount > 0 && oldPrice > 0){
finalPrice = Math.round(oldPrice - (oldPrice * discount / 100));
}

const data = {

name: $("name").value,

price: finalPrice,

oldPrice: oldPrice,

discount: discount,

city: $("city").value,

category: $("category").value,

image: $("image").value,

qty: Number($("qty").value)

};

await addDoc(productsRef,data);

alert("✅ تم حفظ المنتج");

loadProducts();

};

async function loadProducts(){

const box = $("products");

box.innerHTML = "";

const snap = await getDocs(productsRef);

snap.forEach(item=>{

const p = item.data();

box.innerHTML += `

<div class="product">

${p.image ? `<img src="${p.image}">` : ""}

<h3>${p.name}</h3>

${p.discount > 0 ? `
<div class="offer">🔥 خصم ${p.discount}%</div>
<div class="old">${p.oldPrice} ريال</div>
` : ""}

<div><b>${p.price} ريال</b></div>

<div>📂 ${p.category}</div>

<div>📍 ${p.city}</div>

<div>📦 الكمية: ${p.qty}</div>

<button onclick="deleteProduct('${item.id}')">
🗑️ حذف
</button>

</div>

`;

});

}

window.deleteProduct = async(id)=>{

if(!confirm("هل تريد حذف المنتج؟")) return;

await deleteDoc(doc(db,"products",id));

loadProducts();

};

loadProducts();

</script>



</body>

</html>
