<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>إدارة سوق مباشر</title>


<style>

body{

font-family:Tahoma,Arial;

background:#f5f5f5;

padding:15px;

}


.container{

max-width:700px;

margin:auto;

background:white;

padding:20px;

border-radius:12px;

}


input,select,button{

width:100%;

padding:12px;

margin:8px 0;

}


button{

background:#198754;

color:white;

border:0;

border-radius:8px;

font-size:16px;

}


.product{

border:1px solid #ddd;

padding:10px;

margin-top:10px;

border-radius:10px;

}


.product img{

width:100%;

height:200px;

object-fit:contain;

}


#adminBox{

display:none;

}

</style>


</head>


<body>


<div class="container">



<div id="loginBox">


<h2>

🔐 دخول الإدارة

</h2>



<input id="email" type="email" placeholder="البريد الإلكتروني">


<input id="password" type="password" placeholder="كلمة المرور">


<button id="loginBtn">

دخول

</button>



</div>
<div id="adminBox">

<h2>➕ إضافة منتج</h2>


<input id="name" placeholder="اسم المنتج">


<input id="price" type="number" placeholder="السعر">


<input id="oldPrice" type="number" placeholder="السعر القديم">


<input id="city" placeholder="المدينة">


<select id="category">

<option value="الإلكترونيات">
💻 الإلكترونيات
</option>


<option value="العطور">
🌸 العطور
</option>


<option value="المواد الغذائية">
🛒 المواد الغذائية
</option>


<option value="الملابس">
👕 الملابس
</option>


<option value="أخرى">
📦 أخرى
</option>


</select>


<input id="image" placeholder="رابط الصورة">


<input id="qty" type="number" placeholder="الكمية">


<button id="saveBtn">

💾 حفظ المنتج

</button>


<button id="logoutBtn">

🚪 تسجيل الخروج

</button>


<div id="products">

</div>
<h2>📦 الطلبات</h2>

<div id="orders"></div>

</div>


</div>
<script type="module">


import { auth, db } from "./firebase.js";


import {

signInWithEmailAndPassword,

signOut,

onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";



import {

collection,

addDoc,

getDocs,

deleteDoc,

doc

}

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";





const $ = id => document.getElementById(id);



const productsRef = collection(db,"products");





// تسجيل الدخول


$("loginBtn").onclick = async()=>{


try{


await signInWithEmailAndPassword(

auth,

$("email").value,

$("password").value

);



}

catch(error){


alert(error.message);


}


};





// تسجيل الخروج


$("logoutBtn").onclick = ()=>{


signOut(auth);


};





// مراقبة الدخول


onAuthStateChanged(auth,user=>{


if(user){


$("loginBox").style.display="none";


$("adminBox").style.display="block";


loadProducts();


}


else{


$("loginBox").style.display="block";


$("adminBox").style.display="none";


}



});





// حفظ المنتج


$("saveBtn").onclick = async()=>{



let data={


name:$("name").value,


price:Number($("price").value),


oldPrice:Number($("oldPrice").value),


city:$("city").value,


category:$("category").value,


image:$("image").value,


qty:Number($("qty").value)


};





await addDoc(productsRef,data);




alert("تم حفظ المنتج");



loadProducts();


};





async function loadProducts(){


let box=$("products");


box.innerHTML="";



const snap=await getDocs(productsRef);



snap.forEach(item=>{


let p=item.data();



box.innerHTML+=`

<div class="product">


${p.image ? `<img src="${p.image}">`:""}


<h3>${p.name}</h3>


<p>
السعر: ${p.price} ريال
</p>


<p>
القسم: ${p.category}
</p>



<button onclick="deleteProduct('${item.id}')">

🗑️ حذف

</button>


</div>

`;



});


}





window.deleteProduct = async function(id){



if(confirm("حذف المنتج؟")){


await deleteDoc(doc(db,"products",id));


loadProducts();


}


};



</script>

<script type="module" src="admin-orders.js"></script>
</body>

</html>
