<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>لوحة إدارة | Yemen Ride | يمن رايد</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h1,h2{
text-align:center;
color:#198754;
margin:10px 0;
}

.loginBox,
.panel{
margin-top:20px;
}

input,
button,
select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#198754;
color:#fff;
border:none;
cursor:pointer;
}

button:hover{
background:#157347;
}

.order,
.account{
background:#f8f9fa;
border:1px solid #ddd;
border-radius:10px;
padding:12px;
margin:10px 0;
}

.success{
background:#198754;
}

.delete{
background:#dc3545;
}

.logout{
background:#6c757d;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🚗 Yemen Ride</h1>
<h2>لوحة الإدارة</h2>

<div id="loginBox" class="loginBox">

<input
type="email"
id="email"
placeholder="البريد الإلكتروني">

<input
type="password"
id="password"
placeholder="كلمة المرور">

<button id="loginBtn">
تسجيل الدخول
</button>

</div>

<div id="panel" class="panel hidden">

<button id="logoutBtn" class="logout">
تسجيل الخروج
</button>

<h2>📦 الطلبات</h2>

<div id="orders"></div>

<h2>💰 حسابات المشاوير</h2>

<input id="tripName" placeholder="اسم المشوار أو الخدمة">

<input id="tripAmount" type="number" placeholder="المبلغ المستلم">

<input id="tripCost" type="number" placeholder="تكلفة المشوار">

<button id="saveAccount">
💾 حفظ المشوار
</button>

<div id="accounts"></div>
  <script type="module">

import { db, auth } from "./firebase.js";

import {
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
collection,
query,
orderBy,
onSnapshot,
updateDoc,
deleteDoc,
doc,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const loginBox = document.getElementById("loginBox");
const panel = document.getElementById("panel");
const ordersDiv = document.getElementById("orders");
const accountsDiv = document.getElementById("accounts");


document.getElementById("loginBtn").onclick = async()=>{

try{

await signInWithEmailAndPassword(
auth,
document.getElementById("email").value,
document.getElementById("password").value
);

}catch(e){

alert(e.message);

}

};


document.getElementById("logoutBtn").onclick=()=>{

signOut(auth);

};


onAuthStateChanged(auth,user=>{

if(user){

loginBox.classList.add("hidden");
panel.classList.remove("hidden");
loadOrders();

setTimeout(() => {
    loadAccounts();
}, 500);


}else{

loginBox.classList.remove("hidden");
panel.classList.add("hidden");

}

});


// حفظ المشوار
document.getElementById("saveAccount").onclick = async()=>{

const tripName =
document.getElementById("tripName").value.trim();

const tripAmount =
Number(document.getElementById("tripAmount").value);

const tripCost =
Number(document.getElementById("tripCost").value);


if(!tripName){

alert("اكتب اسم المشوار");
return;

}


await addDoc(collection(db,"accounts"),{

name:tripName,
amount:tripAmount,
cost:tripCost,
profit:tripAmount-tripCost,
createdAt:serverTimestamp()

});


document.getElementById("tripName").value="";
document.getElementById("tripAmount").value="";
document.getElementById("tripCost").value="";


alert("تم حفظ المشوار بنجاح");
  

};

function loadOrders(){

const q=query(
collection(db,"orders"),
orderBy("createdAt","desc")
);

onSnapshot(q,snap=>{

ordersDiv.innerHTML="";

snap.forEach(d=>{

const o=d.data();

ordersDiv.innerHTML+=`

<div class="order">

<p><b>👤 العميل:</b> ${o.name || ""}</p>
<p><b>📞 الجوال:</b> ${o.phone || ""}</p>
<p><b>🚗 من:</b> ${o.from || ""}</p>
<p><b>📍 إلى:</b> ${o.to || ""}</p>
<p><b>🛵 الخدمة:</b> ${o.service || ""}</p>
<p>✅ الحالة: ${o.status || "جديد"}</p>


<button class="success"
onclick="finishOrder('${d.id}')">
تم التسليم
</button>


<button class="delete"
onclick="deleteOrder('${d.id}')">
حذف الطلب
</button>

</div>

`;

});

});

}



function loadAccounts(){

const q=query(
collection(db,"accounts"),
orderBy("createdAt","desc")
);


onSnapshot(q,snap=>{

accountsDiv.innerHTML="";


snap.forEach(d=>{

const a=d.data();


accountsDiv.innerHTML+=`

<div class="account">

<p><b>🚗 المشوار:</b> ${a.name || ""}</p>

<p><b>💰 المبلغ المستلم:</b> ${a.amount || 0} ريال</p>

<p><b>⛽ تكلفة المشوار:</b> ${a.cost || 0} ريال</p>

<p><b>📈 الربح:</b> ${a.profit || 0} ريال</p>


<button class="delete"
onclick="deleteAccount('${d.id}')">
حذف المشوار
</button>

</div>

`;

});

});

}




window.finishOrder = async(id)=>{

await updateDoc(doc(db,"orders",id),{

status:"تم التسليم"

});

};




window.deleteOrder = async(id)=>{

if(confirm("هل تريد حذف الطلب؟")){

await deleteDoc(doc(db,"orders",id));

}

};




window.deleteAccount = async(id)=>{

if(confirm("هل تريد حذف المشوار؟")){

await deleteDoc(doc(db,"accounts",id));

}

};


</script>

</div>

</body>
</html>
