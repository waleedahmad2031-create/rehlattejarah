<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>إدارة وصلني</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:#198754;
}

input,button{
width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
border-radius:8px;
}

input{
border:1px solid #ccc;
}

button{
background:#198754;
color:white;
border:none;
cursor:pointer;
font-size:16px;
}

.order{
border:1px solid #ddd;
padding:12px;
border-radius:10px;
margin-top:10px;
background:#fafafa;
}

#adminBox{
display:none;
}

</style>

</head>

<body>

<div class="container">

<div id="loginBox">

<h2>🔐 دخول الإدارة</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">
دخول
</button>

</div>

<div id="adminBox">

<h2>🚗 إدارة طلبات وصلني</h2>

<button id="logoutBtn">
🚪 تسجيل الخروج
</button>

<div id="orders">
جاري تحميل الطلبات...
</div>

</div>

</div>
<script type="module">

import { auth, db } from "./firebase.js";

import {
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
  import {
collection,
getDocs,
query,
orderBy,
doc,
deleteDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const email = document.getElementById("email");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");
const ordersBox = document.getElementById("orders");

loginBtn.onclick = async()=>{

try{

await signInWithEmailAndPassword(
auth,
email.value,
password.value
);

}catch(err){

alert(err.message);

}

};

logoutBtn.onclick=()=>{

signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

if(user){

loginBox.style.display="none";
adminBox.style.display="block";

loadOrders();

}else{

loginBox.style.display="block";
adminBox.style.display="none";

}

});

async function loadOrders(){

ordersBox.innerHTML="";

const q = query(
collection(db,"orders"),
orderBy("createdAt","desc")
);

const snap = await getDocs(q);

snap.forEach(doc=>{

const o = doc.data();

ordersBox.innerHTML += `
<div class="order">

<p>👤 الاسم: ${o.name || "غير موجود"}</p>

<p>📞 الجوال: ${o.phone || "غير موجود"}</p>
<a 
href="https://wa.me/${o.phone.startsWith('0') ? '967'+o.phone.substring(1) : '967'+o.phone}" 
target="_blank"
style="
display:block;
background:#25D366;
color:white;
padding:12px;
border-radius:8px;
text-decoration:none;
margin-top:10px;
font-weight:bold;">
💬 واتساب العميل
</a>
<p>📍 من: ${o.from || "غير موجود"}</p>

<p>🎯 إلى: ${o.to || "غير موجود"}</p>

<p>🚗 الخدمة: ${o.service || "غير محددة"}</p>



<p>✅ الحالة: ${o.status || "جديد"}</p>
<button onclick="completeOrder('${doc.id}')">
✅ تم التسليم
</button>

<button onclick="removeOrder('${doc.id}')">
🗑️ حذف الطلب
</button>
</div>
`;

});

if(ordersBox.innerHTML==""){
ordersBox.innerHTML="لا توجد طلبات.";
}

}
window.completeOrder = async(id)=>{

await updateDoc(doc(db,"orders",id),{
status:"تم التسليم"
});

alert("✅ تم تحديث حالة الطلب");

loadOrders();

};


window.removeOrder = async(id)=>{

if(confirm("هل تريد حذف الطلب؟")){

await deleteDoc(doc(db,"orders",id));

alert("🗑️ تم حذف الطلب");

loadOrders();

}

};
</script>
</body>
</html>
