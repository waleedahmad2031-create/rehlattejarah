<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إدارة المنتجات</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
}

.box{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
}

input,select,button{
width:100%;
padding:10px;
margin:8px 0;
}

button{
cursor:pointer;
}

.item{
border:1px solid #ddd;
padding:10px;
margin-top:10px;
}

img{
width:100px;
height:100px;
object-fit:cover;
}

#admin{
display:none;
}

</style>

</head>

<body>


<div class="box">


<div id="login">

<h2>دخول الإدارة</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل الدخول</button>

<p id="msg"></p>

</div>



<div id="admin">

<h2>لوحة إدارة سوق مباشر</h2>

<button id="logout">تسجيل الخروج</button>

<input id="name" placeholder="اسم المنتج">

<input id="price" type="number" placeholder="السعر">

<input id="city" placeholder="المدينة">

<input id="qty" placeholder="الكمية">

<input id="image" placeholder="رابط الصورة">


<select id="category">

<option value="">اختر القسم</option>

<option>مواد غذائية</option>

<option>خضروات وفواكه</option>

<option>زيوت</option>

<option>عطور</option>

<option>أخرى</option>

</select>


<button id="save">حفظ المنتج</button>


<div id="products"></div>


</div>


</div>
<script type="module">

...

// هنا ضع كود الحفظ

</script>







</body>

</html>
