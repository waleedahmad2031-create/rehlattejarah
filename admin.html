<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة سوق مباشر</title>

<style>
body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1,h2{
text-align:center;
color:#198754;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#198754;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}
  select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
  }

button:hover{
background:#157347;
}

#adminBox{
display:none;
}

.product{
border:1px solid #ddd;
padding:10px;
margin-top:10px;
border-radius:8px;
}
</style>

</head>

<body>

<div class="container">

<h1>لوحة إدارة سوق مباشر</h1>

<div id="loginBox">

<input type="email" id="email" placeholder="البريد الإلكتروني">

<input type="password" id="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل الدخول</button>

</div>

<div id="adminBox">

<h2>إضافة منتج</h2>

<input id="name" placeholder="اسم المنتج">

<input id="price" type="number" placeholder="السعر">

<input id="city" placeholder="المدينة">

<select id="category">

<option value="مواد غذائية">مواد غذائية</option>

<option value="عطور">عطور</option>

<option value="زيوت">زيوت</option>

<option value="ملابس">ملابس</option>

<option value="أخرى">أخرى</option>

</select>

<input id="image" placeholder="رابط الصورة">

<input id="qty" type="number" placeholder="الكمية">

<button id="saveBtn">حفظ المنتج</button>

<button id="logoutBtn">تسجيل الخروج</button>

<hr>

<div id="products"></div>

</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
collection,
addDoc,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const productsRef = collection(db,"products");

const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");

const email = document.getElementById("email");
const password = document.getElementById("password");

const name = document.getElementById("name");
const price = document.getElementById("price");
const city = document.getElementById("city");
const category = document.getElementById("category");
const image = document.getElementById("image");
const qty = document.getElementById("qty");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const saveBtn = document.getElementById("saveBtn");
const products = document.getElementById("products");

loginBtn.onclick = async () => {

try{

await signInWithEmailAndPassword(
auth,
email.value,
password.value
);

}catch(e){

alert(e.message);

}

};

logoutBtn.onclick = async()=>{

await signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

if(user){

loginBox.style.display="none";
adminBox.style.display="block";

loadProducts();

}else{

loginBox.style.display="block";
adminBox.style.display="none";

}

});
async function loadProducts(){

products.innerHTML="";

const snap = await getDocs(productsRef);

snap.forEach((d)=>{

const data = d.data();

products.innerHTML += `
<div class="product">
<b>${data.name}</b><br>
السعر: ${data.price}<br>
المدينة: ${data.city}<br>
القسم: ${data.category}<br>
الكمية: ${data.qty}<br><br>

<button onclick="deleteProduct('${d.id}')">
حذف
</button>

</div>
`;

});

}

saveBtn.onclick = async()=>{

try{

await addDoc(productsRef,{

name:name.value,

price:Number(price.value),

city:city.value,

category:category.value,

image:image.value,

qty:Number(qty.value)

});

alert("تم حفظ المنتج");

name.value="";
price.value="";
city.value="";
category.value="";
image.value="";
qty.value="";

loadProducts();

}catch(e){

alert(e.message);

}

};

window.deleteProduct = async(id)=>{

if(!confirm("حذف المنتج؟")) return;

await deleteDoc(doc(db,"products",id));

loadProducts();

};
</script>

</body>
</html>
