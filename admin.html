<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>لوحة إدارة | Yemen Ride | يمن رايد</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h1,h2{
text-align:center;
color:#198754;
margin:10px 0;
}

.loginBox,
.panel{
margin-top:20px;
}

input,
button,
select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#198754;
color:#fff;
border:none;
cursor:pointer;
}

button:hover{
background:#157347;
}

.order,
.account{
background:#f8f9fa;
border:1px solid #ddd;
border-radius:10px;
padding:12px;
margin:10px 0;
}

.success{
background:#198754;
}

.delete{
background:#dc3545;
}

.logout{
background:#6c757d;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🚗 Yemen Ride</h1>
<h2>لوحة الإدارة</h2>

<div id="loginBox" class="loginBox">

<input
type="email"
id="email"
placeholder="البريد الإلكتروني">

<input
type="password"
id="password"
placeholder="كلمة المرور">

<button id="loginBtn">
تسجيل الدخول
</button>

</div>

<div id="panel" class="panel hidden">

<button id="logoutBtn" class="logout">
تسجيل الخروج
</button>

<h2>📦 الطلبات</h2>

<div id="orders"></div>

<h2>💰 الحسابات</h2>
<input id="accName" placeholder="اسم الصنف">

<input id="buyPrice" type="number" placeholder="سعر الشراء">

<input id="sellPrice" type="number" placeholder="سعر البيع">

<button id="saveAccount">
💾 حفظ الحساب
</button>
<div id="accounts"></div>

  <script type="module">

import { db, auth } from "./firebase.js";

import {
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
collection,
query,
orderBy,
onSnapshot,
updateDoc,
deleteDoc,
doc,
addDoc,
serverTimestamp
}
 from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const loginBox = document.getElementById("loginBox");
const panel = document.getElementById("panel");
const ordersDiv = document.getElementById("orders");
const accountsDiv = document.getElementById("accounts");

document.getElementById("loginBtn").onclick = async()=>{

try{

await signInWithEmailAndPassword(
auth,
document.getElementById("email").value,
document.getElementById("password").value
);

}catch(e){

alert(e.message);

}

};

document.getElementById("logoutBtn").onclick=()=>{

signOut(auth);

};

onAuthStateChanged(auth,user=>{

if(user){

loginBox.classList.add("hidden");
panel.classList.remove("hidden");

loadOrders();
loadAccounts();

}else{

loginBox.classList.remove("hidden");
panel.classList.add("hidden");

}

});
document.getElementById("saveAccount").onclick = async()=>{

const name = document.getElementById("accName").value.trim();
const buy = Number(document.getElementById("buyPrice").value);
const sell = Number(document.getElementById("sellPrice").value);

if(!name){
alert("اكتب اسم الصنف");
return;
}

await addDoc(collection(db,"accounts"),{
name,
buy,
sell,
profit: sell - buy,
createdAt: serverTimestamp()
});

document.getElementById("accName").value="";
document.getElementById("buyPrice").value="";
document.getElementById("sellPrice").value="";
};
function loadOrders(){

const q=query(
collection(db,"orders"),
orderBy("createdAt","desc")
);

onSnapshot(q,snap=>{

ordersDiv.innerHTML="";

snap.forEach(d=>{

const o=d.data();

ordersDiv.innerHTML+=`
<div class="order">

<p><b>👤</b> ${o.name}</p>
<p><b>📞</b> ${o.phone}</p>
<p><b>🚗</b> ${o.from}</p>
<p><b>📍</b> ${o.to}</p>
<p><b>🛵</b> ${o.service}</p>
<p>✅ الحالة: ${o.status || "جديد"}</p>

<button class="success"
onclick="finishOrder('${d.id}')">
تم التسليم
</button>

<button class="delete"
onclick="deleteOrder('${d.id}')">
حذف الطلب
</button>

</div>
`;

});

});

}
function loadAccounts(){

const q=query(
collection(db,"accounts"),
orderBy("createdAt","desc")
);

onSnapshot(q,snap=>{

accountsDiv.innerHTML="";

snap.forEach(d=>{

const a=d.data();

accountsDiv.innerHTML+=`
<div class="account">

<p><b>📦 الصنف:</b> ${a.name || ""}</p>
<p><b>💰 سعر الشراء:</b> ${a.buy || ""}</p>
<p><b>🏷️ سعر البيع:</b> ${a.sell || ""}</p>
<p><b>📈 الربح:</b> ${a.profit || ""}</p>

<button class="delete"
onclick="deleteAccount('${d.id}')">
حذف الحساب
</button>

</div>
`;

});

});

}

window.finishOrder = async(id)=>{

await updateDoc(doc(db,"orders",id),{
status:"تم التسليم"
});

};

window.deleteOrder = async(id)=>{

if(confirm("هل تريد حذف الطلب؟")){

await deleteDoc(doc(db,"orders",id));

}

};

window.deleteAccount = async(id)=>{

if(confirm("هل تريد حذف الحساب؟")){

await deleteDoc(doc(db,"accounts",id));

}

};

</script>

</div>

</body>
</html>
