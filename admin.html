<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
}

input,button{
width:100%;
padding:12px;
margin:8px 0;
}

button{
background:#0066cc;
color:white;
border:0;
border-radius:6px;
}
</style>

</head>

<body>

<div class="box">

<h2>لوحة تحكم رحلة تجارة من الصفر</h2>

<input id="pass" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<p id="msg"></p>

</div>

<script>

function login(){

let password=document.getElementById("pass").value;

if(password=="0550496391"){

document.getElementById("msg").innerHTML=
"تم الدخول بنجاح";

}else{

document.getElementById("msg").innerHTML=
"كلمة المرور خطأ";

}

}

</script>

</body>
</html>
