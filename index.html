<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سوق مباشر</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
color:#198754;
}

.notice{
background:#fff3cd;
padding:12px;
border-radius:10px;
text-align:center;
margin-bottom:15px;
}

.cart{
display:block;
background:#198754;
color:white;
text-align:center;
padding:14px;
border-radius:10px;
text-decoration:none;
margin:15px 0;
font-size:18px;
font-weight:bold;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ccc;
}

.card img{
width:100%;
height:220px;
object-fit:contain;
}

button{
background:#198754;
color:white;
border:0;
padding:12px;
width:90%;
border-radius:10px;
font-size:16px;
}

</style>

</head>

<body>
<div class="notice">
🚗 أهلاً بكم في <b>وصلني</b><br>
⚡ احجز مشوار أو اطلب خدمة توصيل بكل سهولة
</div>

<h1>🚗 وصلني</h1>

<div class="card">
<h3>📋 اطلب الخدمة</h3>

<input id="name" type="text" placeholder="الاسم" style="width:95%;padding:10px;margin:5px;border-radius:8px;">

<input id="phone" type="text" placeholder="رقم الجوال" style="width:95%;padding:10px;margin:5px;border-radius:8px;">

<input id="from" type="text" placeholder="موقع الانطلاق" style="width:95%;padding:10px;margin:5px;border-radius:8px;">

<input id="to" type="text" placeholder="الوجهة" style="width:95%;padding:10px;margin:5px;border-radius:8px;">

<select id="service" style="width:95%;padding:10px;margin:5px;border-radius:8px;">
<option>🚗 مشوار</option>
<option>🛵 توصيل طلبات</option>
<option>📦 توصيل طرود</option>
<option>💊 توصيل أدوية</option>
</select>

<textarea id="notes" placeholder="ملاحظات" style="width:95%;padding:10px;margin:5px;border-radius:8px;"></textarea>

<button id="sendOrder">
📨 إرسال الطلب
</button>

</div>
<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

document.getElementById("sendOrder").onclick = async () => {

const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const from = document.getElementById("from").value;
const to = document.getElementById("to").value;
const service = document.getElementById("service").value;
const notes = document.getElementById("notes").value;

if(!name || !phone || !from || !to){
alert("يرجى تعبئة جميع الحقول المطلوبة");
return;
}

try{

await addDoc(collection(db,"orders"),{

name,
phone,
from,
to,
service,
notes,
status:"جديد",
createdAt:serverTimestamp()

});

alert("✅ تم إرسال الطلب بنجاح");

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("from").value="";
document.getElementById("to").value="";
document.getElementById("notes").value="";

}catch(err){

alert(err.message);

}

};

  </script>


</body>

</html>
