<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>وصلني</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:15px;
}

.container{
max-width:600px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#198754;
}

.notice{
background:#d1e7dd;
padding:12px;
border-radius:10px;
text-align:center;
margin-bottom:20px;
font-weight:bold;
}

input,
select,
textarea,
button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
box-sizing:border-box;
}

input,
select,
textarea{
border:1px solid #ccc;
}

button{
background:#198754;
color:#fff;
border:none;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#157347;
}

.whatsapp{
position:fixed;
bottom:20px;
left:20px;
width:60px;
height:60px;
background:#25D366;
color:#fff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="notice">
🚗 مرحبًا بك في <b>وصلني</b><br>
اطلب مشوارك أو خدمة التوصيل بسهولة.
</div>

<h1>🚗 وصلني</h1>

<input id="name" placeholder="الاسم">

<input id="phone" placeholder="رقم الجوال">

<input id="from" placeholder="موقع الانطلاق">

<input id="to" placeholder="الوجهة">

<select id="service">
<option>🚗 مشوار</option>
<option>🛵 توصيل طلبات</option>
<option>📦 توصيل طرود</option>
<option>💊 توصيل أدوية</option>
</select>



<button id="sendOrder">
📨 إرسال الطلب
</button>

</div>
  <script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const sendBtn = document.getElementById("sendOrder");

sendBtn.onclick = async()=>{

const name = document.getElementById("name").value.trim();
const phone = document.getElementById("phone").value.trim();
const from = document.getElementById("from").value.trim();
const to = document.getElementById("to").value.trim();
const service = document.getElementById("service").value;


if(!name || !phone || !from || !to){
alert("يرجى تعبئة جميع الحقول المطلوبة");
return;
}

try{

await addDoc(collection(db,"orders"),{
name,
phone,
from,
to,
service,
status:"جديد",
createdAt:serverTimestamp()
});

alert("✅ تم إرسال الطلب بنجاح");

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("from").value="";
document.getElementById("to").value="";


}catch(err){

alert(err.message);

}

};

</script>

<a href="https://wa.me/966550496391" class="whatsapp">
💬
</a>

</body>
</html>
