<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سوق مباشر</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
color:#198754;
}

.notice{
background:#fff3cd;
padding:12px;
border-radius:10px;
text-align:center;
margin-bottom:15px;
}

.cart{
display:block;
background:#198754;
color:white;
text-align:center;
padding:14px;
border-radius:10px;
text-decoration:none;
margin:15px 0;
font-size:18px;
font-weight:bold;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #ccc;
}

.card img{
width:100%;
height:220px;
object-fit:contain;
}

button{
background:#198754;
color:white;
border:0;
padding:12px;
width:90%;
border-radius:10px;
font-size:16px;
}

</style>

</head>

<body>

<div class="notice">
🎉 أهلاً بكم في <b>سوق مباشر</b><br>
🚚 التوصيل إلى باب بيتك بـ 5 ريال فقط
</div>

<h1>🛒 سوق مباشر</h1>

<a class="cart" href="cart.html">
🛍️ الذهاب إلى السلة
</a>

<div id="products">
جاري تحميل المنتجات...
</div>
<script type="module">

import { db } from "./firebase.js";


import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const productsBox = document.getElementById("products");



async function loadProducts(){

try{


const snap = await getDocs(collection(db,"products"));


productsBox.innerHTML = "";


snap.forEach((doc)=>{


const p = doc.data();



productsBox.innerHTML += `

<div class="card">

${p.image ? 
`<img src="${p.image}" loading="lazy">`
:
""}


<h3>${p.name || ""}</h3>


<p>
💰 السعر:
${p.price || 0}
ريال
</p>


<p>
📍 ${p.city || ""}
</p>


<p>
📦 الكمية:
${p.qty || 0}
</p>


<button onclick="addCart('${p.name}','${p.price}')">

🛒 أضف للسلة

</button>


</div>


`;


});


if(productsBox.innerHTML===""){

productsBox.innerHTML="لا توجد منتجات حاليا";

}


}catch(error){

productsBox.innerHTML=error.message;

}


}



window.addCart=function(name,price){


let cart = JSON.parse(localStorage.getItem("cart")) || [];


cart.push({

name:name,

price:Number(price)

});


localStorage.setItem(

"cart",

JSON.stringify(cart)

);


alert("✅ تمت إضافة المنتج إلى السلة");


};



loadProducts();


</script>


</body>

</html>
