<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>وصلني</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.container{
max-width:600px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.notice{
background:#d1e7dd;
color:#0f5132;
padding:12px;
border-radius:10px;
text-align:center;
margin-bottom:20px;
font-weight:bold;
}

h1{
text-align:center;
color:#198754;
margin-bottom:20px;
}

input,
select,
button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#198754;
color:#fff;
border:none;
cursor:pointer;
}

button:hover{
background:#157347;
}

.locationBtn{
background:#0d6efd;
}

.locationBtn:hover{
background:#0b5ed7;
}

.whatsapp{
position:fixed;
bottom:20px;
left:20px;
width:60px;
height:60px;
background:#25D366;
color:#fff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
box-shadow:0 4px 10px rgba(0,0,0,.3);
}

</style>

</head>

<body>

<div class="container">

<div class="notice">

🚗 مرحبًا بك في <b>وصلني</b><br>

اطلب مشوارك أو خدمة التوصيل بكل سهولة.

</div>

<h1>🚗 وصلني</h1>

<input id="name" placeholder="الاسم">

<input id="phone" placeholder="رقم الجوال">

<input id="from" placeholder="من أين المشوار؟">

<button type="button" id="myLocation" class="locationBtn">

📍 استخدام موقعي الحالي

</button>

<input id="to" placeholder="إلى أين المشوار؟">

<select id="service">

<option>🚗 مشوار</option>

<option>🛵 توصيل طلبات</option>

<option>📦 توصيل طرود</option>

<option>💊 توصيل أدوية</option>

</select>

<button id="sendOrder">

📨 إرسال الطلب

</button>
  


  </div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const sendBtn = document.getElementById("sendOrder");

document.getElementById("myLocation").onclick = ()=>{

if(!navigator.geolocation){

alert("جهازك لا يدعم تحديد الموقع");

return;

}

navigator.geolocation.getCurrentPosition(

(pos)=>{

const lat = pos.coords.latitude;

const lng = pos.coords.longitude;

document.getElementById("from").value =
"https://maps.google.com/?q="+lat+","+lng;

},

()=>{

alert("تعذر الحصول على الموقع");

}

);

};

sendBtn.onclick = async()=>{

const name = document.getElementById("name").value.trim();

const phone = document.getElementById("phone").value.trim();

const from = document.getElementById("from").value.trim();

const to = document.getElementById("to").value.trim();

const service = document.getElementById("service").value;

if(!name || !phone || !from || !to){

alert("يرجى تعبئة جميع الحقول");

return;

}

try{

await addDoc(collection(db,"orders"),{

name,

phone,

from,

to,

service,

status:"جديد",

createdAt:serverTimestamp()
  

});
  
let whatsapp = "967771234567"; // غيّر هذا إلى رقم واتساب الإدارة في اليمن

let message =
`🚗 طلب جديد

👤 الاسم: ${name}
📞 الجوال: ${phone}
🚗 من أين المشوار: ${from}
📍 إلى أين المشوار: ${to}
🛵 الخدمة: ${service}`;

window.open(
"https://wa.me/"+whatsapp+"?text="+encodeURIComponent(message),
"_blank"
);

alert("✅ تم إرسال الطلب بنجاح");

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("from").value="";
document.getElementById("to").value="";
document.getElementById("service").selectedIndex=0;

}catch(err){

alert(err.message);

}

};

</script>

<a href="https://wa.me/967715693340" class="whatsapp">
💬
</a>

</body>
</html>
