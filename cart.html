<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سلة المشتريات</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
color:#198754;
margin-bottom:15px;
}

.item{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.total{
background:white;
padding:15px;
border-radius:10px;
font-size:20px;
font-weight:bold;
margin-top:15px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
width:100%;
color:white;
border:0;
padding:15px;
border-radius:10px;
font-size:18px;
margin-top:15px;
cursor:pointer;
}

.checkout-btn{
background:#198754;
}

.cancel-btn{
background:#dc3545;
}

</style>

</head>

<body>

<h1>🛒 سلة المشتريات</h1>

<div id="cart"></div>

<div class="total">
المجموع:
<span id="total">0</span>
ريال
</div>

<button class="checkout-btn" onclick="checkout()">
✅ إتمام الطلب
</button>

<button class="cancel-btn" onclick="cancelOrder()">
❌ إلغاء الطلب
</button>

<script>
 
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let box = document.getElementById("cart");

let total = 0;

cart.forEach(item => {

total += Number(item.price);

box.innerHTML += `

<div class="item">

<h3>${item.name}</h3>

<p>السعر: ${item.price} ريال</p>

</div>

`;

});

document.getElementById("total").innerHTML = total;


// إتمام الطلب
function checkout(){

if(cart.length === 0){
alert("السلة فارغة");
return;
}

if(total < 50){
alert("الحد الأدنى للطلب 50 ريال");
return;
}

if(!confirm("هل تريد إتمام الطلب وإرسال الطلب إلى واتساب؟")){
return;
}

let message = "السلام عليكم، أريد طلب المنتجات:\n\n";

cart.forEach(item => {

message += "- " + item.name + " : " + item.price + " ريال\n";

});

message += "\nالمجموع: " + total + " ريال";

let phone = "966550496391";

window.open(
"https://wa.me/" +
phone +
"?text=" +
encodeURIComponent(message),
"_blank"
);

// حذف السلة بعد الإرسال
cart = [];
localStorage.removeItem("cart");

setTimeout(() => {
location.reload();
},500);

}


// إلغاء الطلب
function cancelOrder(){

if(confirm("هل تريد إلغاء الطلب وحذف جميع المنتجات من السلة؟")){

cart = [];
localStorage.removeItem("cart");
location.reload();

}

}

</script>

</body>

</html>
