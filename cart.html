<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>سلة المشتريات</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
color:#198754;
}

.item{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 2px 5px #ccc;
}

button{
background:#198754;
color:white;
border:0;
padding:10px;
border-radius:8px;
width:100%;
margin-top:10px;
font-size:16px;
}

.delete{
background:#dc3545;
}

.total{
background:white;
padding:15px;
border-radius:10px;
font-size:20px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🛒 سلة المشتريات</h1>


<div id="cart"></div>


<div class="total" id="total"></div>


<button onclick="goCheckout()">
إتمام الطلب
</button>



<script>


let cart = JSON.parse(localStorage.getItem("cart")) || [];


function showCart(){

let box=document.getElementById("cart");

box.innerHTML="";


let total=0;


if(cart.length==0){

box.innerHTML="<h3>السلة فارغة</h3>";

document.getElementById("total").innerHTML="";

return;

}



cart.forEach((p,index)=>{


total += Number(p.price);



box.innerHTML+=`

<div class="item">

<h3>${p.name}</h3>

<p>السعر: ${p.price} ريال</p>

<p>الكمية: ${p.qty}</p>


<button class="delete" onclick="removeItem(${index})">
حذف
</button>


</div>

`;


});



document.getElementById("total").innerHTML=

"المجموع: "+total+" ريال";


}



function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

showCart();

}



function goCheckout(){

if(cart.length==0){

alert("السلة فارغة");

return;

}

location.href="checkout.html";

}


showCart();


</script>


</body>
</html>
