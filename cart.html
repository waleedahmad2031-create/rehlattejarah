<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>السلة</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
color:#198754;
}

.item{
background:white;
padding:15px;
margin:10px;
border-radius:10px;
}

.total{
background:#fff;
padding:15px;
font-size:20px;
font-weight:bold;
}

button{
background:#198754;
color:white;
border:0;
padding:12px;
border-radius:8px;
width:100%;
}

</style>

</head>


<body>


<h1>🛒 سلة المشتريات</h1>


<div id="cart"></div>


<div class="total">
المجموع: <span id="total">0</span> ريال
</div>


<button onclick="checkout()">
إتمام الطلب
</button>



<script>


let cart=JSON.parse(localStorage.getItem("cart")) || [];


let box=document.getElementById("cart");

let total=0;


cart.forEach(item=>{


total += item.price;


box.innerHTML += `

<div class="item">

<h3>${item.name}</h3>

<p>${item.price} ريال</p>

</div>

`;

});


document.getElementById("total").innerHTML=total;



function checkout(){


if(total < 50){

alert("الحد الأدنى للطلب 50 ريال");

return;

}


alert("يمكنك إكمال الطلب");


}


</script>


</body>

</html>
