<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سلة المشتريات</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
color:#198754;
}

.item{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 5px #ddd;
}

.total{
background:white;
padding:15px;
margin-top:15px;
border-radius:10px;
font-size:20px;
font-weight:bold;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
font-size:18px;
color:white;
margin-top:15px;
}

.checkout{
background:#198754;
}

.cancel{
background:#dc3545;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

</style>

</head>

<body>


<h1>🛒 سلة المشتريات</h1>


<div id="cart"></div>


<div class="total">

المجموع:
<span id="total">0</span>
ريال

</div>









<button class="checkout" onclick="checkout()">

✅ إرسال الطلب

</button>


<button class="cancel" onclick="cancelOrder()">

❌ إلغاء السلة

</button>
<script type="module">

import { saveOrder } from "./orders.js";

import {
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let cart = JSON.parse(localStorage.getItem("cart")) || [];


let box = document.getElementById("cart");


let total = 0;



cart.forEach(item=>{


total += Number(item.price);



box.innerHTML += `

<div class="item">

<h3>${item.name}</h3>

<p>
السعر: ${item.price} ريال
</p>

</div>

`;



});



document.getElementById("total").innerHTML = total;



window.checkout = async function(){



if(cart.length === 0){

alert("السلة فارغة");

return;

}



if(total < 50){

alert("الحد الأدنى للطلب 50 ريال");

return;

}

let order = {

products:cart.map(x=>x.name).join(" - "),

total:total,

createdAt: serverTimestamp()

};



await saveOrder(order);


let message =

"🛒 طلب جديد من سوق مباشر\n\n"+

"📦 المنتجات:\n"+order.products+"\n\n"+

"💰 المجموع: "+total+" ريال\n\n"+

"━━━━━━━━━━━━━━\n"+

"فضلاً أرسل:\n\n"+

"👤 الاسم:\n"+

"📍 الموقع أو العنوان:\n\n"+

"شكراً لاختياركم سوق مباشر ❤️";



window.open(

"https://wa.me/966550496391?text="+

encodeURIComponent(message),

"_blank"

);



cart=[];


localStorage.removeItem("cart");



};
window.cancelOrder = function(){


if(confirm("حذف السلة؟")){


cart=[];


localStorage.removeItem("cart");


location.reload();


}


};


</script>


</body>

</html>
