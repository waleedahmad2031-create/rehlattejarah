<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سلة المشتريات</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
color:#198754;
margin-bottom:15px;
}

.item{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.total{
background:white;
padding:15px;
border-radius:10px;
font-size:20px;
font-weight:bold;
margin-top:15px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
width:100%;
color:white;
border:0;
padding:15px;
border-radius:10px;
font-size:18px;
margin-top:15px;
cursor:pointer;
}

.checkout-btn{
background:#198754;
}

.cancel-btn{
background:#dc3545;
}

</style>

</head>

<body>

<h1>🛒 سلة المشتريات</h1>

<div id="cart"></div>

<div class="total">
المجموع:
<span id="total">0</span>
ريال
</div>

<button class="checkout-btn" onclick="checkout()">
✅ إتمام الطلب
</button>

<button class="cancel-btn" onclick="cancelOrder()">
❌ إلغاء الطلب
</button>l
