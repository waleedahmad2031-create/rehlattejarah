<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سلة المشتريات</title>

<style>
body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#198754;
}

.item{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 0 5px #ccc;
}

.item img{
width:100px;
height:100px;
object-fit:cover;
display:block;
margin:auto;
}

.item h3{
text-align:center;
}

.item p{
text-align:center;
}

.qty{
text-align:center;
margin:10px 0;
}

.qty button{
width:40px;
height:40px;
font-size:20px;
}

.delete{
background:#dc3545;
width:100%;
padding:10px;
color:#fff;
border:0;
border-radius:8px;
margin-top:10px;
}

.total{
background:#fff;
padding:15px;
border-radius:12px;
font-size:20px;
font-weight:bold;
margin-top:20px;
text-align:center;
}

.checkout{
width:100%;
padding:14px;
background:#198754;
color:#fff;
border:0;
border-radius:10px;
font-size:18px;
margin-top:15px;
}
</style>

</head>
<body>

<h1>🛒 سلة المشتريات</h1>

<div id="cart"></div>

<div class="total">
المجموع:
<span id="total">0</span>
ريال
</div>

<button class="checkout" onclick="checkout()">
📦 إتمام الطلب
</button>

<script>

let cart=JSON.parse(localStorage.getItem("cart"))||[];

function save(){
localStorage.setItem("cart",JSON.stringify(cart));
showCart();
}

function showCart(){

const box=document.getElementById("cart");
const totalBox=document.getElementById("total");

box.innerHTML="";

let total=0;

if(cart.length===0){

box.innerHTML="<h3 style='text-align:center'>🛒 السلة فارغة</h3>";
totalBox.innerHTML="0";
return;

}

cart.forEach((p,i)=>{

let qty=p.qty||1;

let price=Number(p.price)||0;

total+=price*qty;

box.innerHTML+=`

<div class="item">

<img src="${p.image}">

<h3>${p.name}</h3>

<p>السعر: ${price} ريال</p>

<div class="qty">

<button onclick="minus(${i})">-</button>

<span style="padding:15px">${qty}</span>

<button onclick="plus(${i})">+</button>

</div>

<p>
الإجمالي:
${price*qty}
ريال
</p>

<button class="delete" onclick="removeItem(${i})">
🗑 حذف
</button>

</div>

`;

});

totalBox.innerHTML=total;

}

function plus(i){

cart[i].qty=(cart[i].qty||1)+1;

save();

}

function minus(i){

if((cart[i].qty||1)>1){

cart[i].qty--;

save();

}

}

function removeItem(i){

cart.splice(i,1);

save();

}

function checkout(){

let total=0;

cart.forEach(p=>{

total+=(Number(p.price)||0)*(p.qty||1);

});

if(cart.length===0){

alert("السلة فارغة");

return;

}

if(total<100){

alert("الحد الأدنى للطلب هو 100 ريال");

return;

}

// الانتقال إلى صفحة إتمام الطلب
location.href="checkout.html";

}

showCart();

</script>

</body>
</html>
