<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سلة المشتريات</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
color:#198754;
}

.item{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
}

.item img{
width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
}

button{
background:#198754;
color:white;
border:0;
padding:10px;
border-radius:8px;
width:100%;
}

.delete{
background:#dc3545;
margin-top:10px;
}

.total{
background:white;
padding:15px;
border-radius:10px;
font-size:20px;
margin-top:15px;
}

</style>

</head>

<body>

<h1>🛒 سلة المشتريات</h1>

<div id="cart"></div>

<div class="total">
المجموع: <span id="total">0</span> ريال
</div>

<br>

<button onclick="checkout()">
إرسال الطلب
</button>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let box = document.getElementById("cart");
let totalBox = document.getElementById("total");


function showCart(){

box.innerHTML="";
let total = 0;


if(cart.length === 0){

box.innerHTML="<h3>السلة فارغة</h3>";
totalBox.innerHTML=0;
return;

}


cart.forEach((p,index)=>{

total += Number(p.price) || 0;


box.innerHTML += `

<div class="item">

<img src="${p.image}">

<h3>${p.name}</h3>

<p>السعر: ${p.price} ريال</p>

<p>المدينة: ${p.city || ""}</p>


<button class="delete" onclick="removeItem(${index})">
حذف
</button>

</div>

`;

});


totalBox.innerHTML = total;

}



function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

showCart();

}



function checkout(){


if(cart.length == 0){

alert("السلة فارغة");
return;

}


let total = 0;


cart.forEach(p=>{

total += Number(p.price) || 0;

});


// الحد الأدنى للطلب
let minimum = 100;


if(total < minimum){

alert("الحد الأدنى للطلب هو 100 ريال");
return;

}


// إنشاء رقم الطلب
let orderId = Date.now();


alert(
"تم إرسال الطلب بنجاح\nرقم الطلب: " + orderId
);


// مسح السلة بعد الطلب
localStorage.removeItem("cart");

cart=[];

showCart();


}


showCart();

</script>


</body>

</html>
