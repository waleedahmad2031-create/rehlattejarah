<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إدارة الطلبات</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
}

.box{
max-width:600px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 0 5px #ccc;
}

h2{
text-align:center;
color:#198754;
}

.order{

background:#f8f8f8;
padding:15px;
margin:15px 0;
border-radius:10px;
border:1px solid #ddd;

}

</style>

</head>


<body>


<div class="box">


<h2>📦 إدارة الطلبات</h2>


<div id="orders">

جاري تحميل الطلبات...

</div>


</div>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

collection,

getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";




const firebaseConfig = {

apiKey:"AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",

authDomain:"rehlattejarah.firebaseapp.com",

projectId:"rehlattejarah",

storageBucket:"rehlattejarah.firebasestorage.app",

messagingSenderId:"56157415045",

appId:"1:56157415045:web:d1c496a5cdc4d5f81e2bec"

};




const app = initializeApp(firebaseConfig);


const db = getFirestore(app);




async function loadOrders(){


const snap = await getDocs(collection(db,"orders"));


let html="";



snap.forEach((doc)=>{


const o = doc.data();



html += `

<div class="order">


<h3>📦 رقم الطلب</h3>

<p><b>${o.orderNo}</b></p>


<p>👤 الاسم: ${o.name}</p>

<p>📞 الجوال: ${o.phone}</p>

<p>🏙️ المدينة: ${o.city}</p>

<p>🏠 العنوان: ${o.address}</p>


<p>📍 الحالة:

<b>${o.status}</b>

</p>


</div>

`;



});



if(html==""){


document.getElementById("orders").innerHTML=

"❌ لا توجد طلبات";


}else{


document.getElementById("orders").innerHTML=html;


}



}



loadOrders();



</script>


</body>

</html>
