<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>سوق مباشر | Direct Market</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
text-align:center;
}

h1{
color:green;
}

#search{
width:90%;
max-width:400px;
padding:10px;
font-size:18px;
border-radius:8px;
border:1px solid #ccc;
}


.category{
margin:10px;
padding:10px;
background:green;
color:white;
border-radius:8px;
display:inline-block;
cursor:pointer;
}


.product{
background:white;
padding:15px;
margin:15px auto;
max-width:450px;
border-radius:10px;
box-shadow:0 0 5px #bbb;
}


.product img{
width:200px;
max-width:100%;
border-radius:8px;
}


.name{
font-size:22px;
font-weight:bold;
color:green;
}


.info{
font-size:18px;
line-height:2;
}


button{
background:green;
color:white;
border:0;
padding:10px;
border-radius:8px;
font-size:18px;
}


</style>

</head>


<body>


<p style="background:green;color:white;padding:12px;border-radius:8px;font-size:20px;font-weight:bold;">

🛒 أهلاً بكم في سوق مباشر  
<br>
Welcome to Direct Market

</p>


<h1>
سوق مباشر | Direct Market
</h1>


<input id="search" placeholder="ابحث عن منتج... Search">


<br><br>


<div class="category" onclick="filterCategory('')">
الكل
</div>

<div class="category" onclick="filterCategory('عطور')">
🌸 عطور
</div>

<div class="category" onclick="filterCategory('زيوت')">
🛢️ زيوت
</div>

<div class="category" onclick="filterCategory('توصيلات')">
🔌 توصيلات
</div>

<div class="category" onclick="filterCategory('قطع غيار')">
⚙️ قطع غيار
</div>


<div id="products"></div>


<script type="module">
  import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
collection,
getDocs
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "ضع بياناتك هنا",

authDomain: "ضع بياناتك هنا",

projectId: "ضع بياناتك هنا",

storageBucket: "ضع بياناتك هنا",

messagingSenderId: "ضع بياناتك هنا",

appId: "ضع بياناتك هنا"

};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



let box = document.getElementById("products");


let allProducts = [];



async function loadProducts(){


let snapshot = await getDocs(collection(db,"products"));


snapshot.forEach((item)=>{


let p = item.data();


allProducts.push(p);


});


showProducts(allProducts);


}




function showProducts(products){


box.innerHTML="";


products.forEach((p)=>{


box.innerHTML += `


<div class="product">


<img src="${p.image}">


<div class="name">

${p.name}

</div>


<div class="info">


💰 السعر: ${p.price}

<br>

📍 المدينة: ${p.city}

<br>

📦 القسم: ${p.category || "أخرى"}

<br>

📝 الوصف: ${p.description || ""}


</div>


<br>


<a href="https://wa.me/${p.phone}?text=السلام عليكم، أريد طلب ${p.name}" target="_blank">


<button>

🛒 اطلب الآن | Order Now

</button>


</a>


</div>


`;



});


}



loadProducts();
  let currentCategory = "";


// فلترة حسب القسم

window.filterCategory = function(category){

currentCategory = category;


let result = allProducts.filter((p)=>{


if(category==""){

return true;

}


return p.category == category;


});


showProducts(result);


};




// البحث

document.getElementById("search").addEventListener("keyup",function(){


let text = this.value.toLowerCase();



let result = allProducts.filter((p)=>{


let data = (

p.name +
p.price +
p.city +
p.description +
p.category

).toLowerCase();



let searchOk = data.includes(text);



let categoryOk = currentCategory=="" || p.category==currentCategory;



return searchOk && categoryOk;


});



showProducts(result);



});
  </script>


</body>

</html>
