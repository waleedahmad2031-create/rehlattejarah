<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>سوق مباشر</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:16px
}

h1{
text-align:center;
color:#198754
}

#search{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:10px
}

.cartBtn{
display:block;
background:#ff9800;
color:white;
padding:12px;
border-radius:10px;
text-align:center;
text-decoration:none;
font-size:18px;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:20px
}

.card{
background:#fff;
padding:16px;
border-radius:12px;
text-align:center;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 4px #ccc
}

.product{
background:#fff;
padding:12px;
border-radius:12px;
margin:12px 0;
box-shadow:0 0 4px #ccc;
text-align:center
}

.product img{
width:150px;
display:block;
margin:auto
}

button{
background:#198754;
color:#fff;
border:0;
padding:10px 14px;
border-radius:8px;
font-size:16px
}

</style>

</head>


<body>


<div style="background:#d32f2f;color:white;padding:12px;border-radius:10px;margin-bottom:15px;font-size:18px;font-weight:bold;">
📢 الحد الأدنى للطلب هو 100 ريال.
</div>


<h1>🛒 سوق مباشر</h1>


<input id="search" placeholder="ابحث عن منتج">


<a class="cartBtn" href="cart.html">
🛒 عرض السلة وإتمام الطلب
</a>


<div class="grid" id="cats"></div>


<div id="products"></div>



<script type="module">


import{initializeApp}
from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import{
getFirestore,
collection,
getDocs
}
from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const cfg={

apiKey:"AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",

authDomain:"rehlattejarah.firebaseapp.com",

projectId:"rehlattejarah",

storageBucket:"rehlattejarah.firebasestorage.app",

messagingSenderId:"56157415045",

appId:"1:56157415045:web:d1c496a5cdc4d5f81e2bec"

};


const db=getFirestore(initializeApp(cfg));


const categories=[
"الكل",
"عطور",
"جوالات",
"مواد غذائية",
"أدوات منزلية",
"خضروات وفواكه",
"خدمات أخرى"
];


const emojis={
"الكل":"📦",
"عطور":"🌸",
"جوالات":"📱",
"مواد غذائية":"🛒",
"أدوات منزلية":"🏠",
"خضروات وفواكه":"🥬",
"خدمات أخرى":"🛠️"
};


let all=[];

let current="الكل";


const val=(p,e,a)=>p[e]??p[a]??"";


cats.innerHTML=categories.map(c=>`

<div class="card" onclick="window.sel('${c}')">

${emojis[c]}<br>${c}

</div>

`).join("");



window.sel=function(c){

current=c;

draw();

};



async function load(){

const s=await getDocs(collection(db,"products"));

all=[];

s.forEach(d=>{

all.push({
id:d.id,
...d.data()
});

});

draw();

}



function draw(){

const t=search.value.toLowerCase();

products.innerHTML="";


all.filter(p=>{

const c=val(p,"category","القسم")||"أخرى";

if(current!="الكل" && c!=current)
return false;


return JSON.stringify(p).toLowerCase().includes(t);


}).forEach(p=>{


const n=val(p,"name","اسم");

const pr=val(p,"price","السعر");

const ci=val(p,"city","المدينة");

const im=val(p,"image","الصورة");

const de=val(p,"description","الوصف");

const ca=val(p,"category","القسم");



products.innerHTML+=`

<div class="product">

<img src="${im}">

<h3>${n}</h3>

<p>💰 السعر: ${pr} ريال</p>

<p>📍 ${ci}</p>

<p>📦 ${ca}</p>

<p>${de}</p>


<button onclick='addToCart(${JSON.stringify({
id:p.id,
name:n,
price:pr,
image:im
})})'>

🛒 أضف إلى السلة

</button>


</div>

`;

});


}



window.addToCart=function(product){


let cart=JSON.parse(localStorage.getItem("cart")) || [];


let old=cart.find(p=>p.id==product.id);


if(old){

old.qty++;

}else{

cart.push({

id:product.id,

name:product.name,

price:Number(product.price),

image:product.image,

qty:1

});

}


localStorage.setItem("cart",JSON.stringify(cart));


alert("✅ تم إضافة المنتج إلى السلة");


}



search.oninput=draw;


load();


</script>


</body>

</html>
