<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رحلة تجارة من الصفر</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
padding:20px;
}

h1{
text-align:center;
color:#0066cc;
}

#search{
width:100%;
padding:12px;
font-size:18px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
}

.product{
background:white;
padding:15px;
margin:15px 0;
border-radius:10px;
box-shadow:0 0 5px #aaa;
}

.product img{
width:200px;
max-width:100%;
border-radius:8px;
}

.name{
font-size:22px;
font-weight:bold;
color:green;
}

.info{
line-height:2;
}

</style>

</head>


<body>


<h1>رحلة تجارة من الصفر</h1>


<input id="search" placeholder="أبحث عن منتج">


<div id="products">
جاري تحميل المنتجات...
</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ضع بيانات Firebase الحقيقية هنا



const firebaseConfig = {
  apiKey: "AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",
  authDomain: "rehlattejarah.firebaseapp.com",
  projectId: "rehlattejarah",
  storageBucket: "rehlattejarah.firebasestorage.app",
  messagingSenderId: "56157415045",
  appId: "1:56157415045:web:d1c496a5cdc4d5f81e2bec"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let box = document.getElementById("products");


async function loadProducts(){


try{


box.innerHTML="";


const snapshot = await getDocs(collection(db,"products"));


if(snapshot.empty){

box.innerHTML="لا توجد منتجات";

return;

}


snapshot.forEach((doc)=>{


let p = doc.data();


box.innerHTML += `


<div class="product">


<div class="name">

${p["اسم"] || "بدون اسم"}

</div>


${p["صورة"] ? `<img src="${p["صورة">` : ""}



<div class="info">


المدينة: ${p["مدينة"] || ""}

<br>

الهاتف: ${p["هاتف"] || ""}

<: ${p["سعر"]


</div>div</div>


`;


});


}

catch(error){

box.innerHTML="حدث خطأ في تحميل البيانات";

console.log(error);

}


}


loadProducts();
  document.getElementById("search").onkeyup=function(){


let text=this.value.toLowerCase();


let items=document.getElementsByClassName("product");


for(let i=0;i<items.length;i++){


if(items[i].innerText.toLowerCase().includes(text)){


items[i].style.display="block";


}else{


items[i].style.display="none";


}


}


};


</script>


</body>

</html>
