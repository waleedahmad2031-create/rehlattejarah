<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوق مباشر</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
text-align:center;
}

h1{
color:green;
}

#search{
width:90%;
max-width:400px;
padding:10px;
font-size:18px;
margin:20px auto;
display:block;
border:1px solid #ccc;
border-radius:8px;
}

.product{
background:#fff;
padding:15px;
margin:15px auto;
max-width:450px;
border-radius:10px;
box-shadow:0 0 5px #bbb;
}

.product img{
width:200px;
max-width:100%;
border-radius:8px;
margin-bottom:10px;
}

.name{
font-size:22px;
font-weight:bold;
color:green;
margin-bottom:10px;
}

.info{
line-height:2;
font-size:18px;
}

</style>

</head>

<body>
<p style="background:green;color:white;padding:12px;border-radius:8px;font-size:20px;font-weight:bold;">
🛒 أهلاً بكم في سوق مباشر – نوصل طلباتكم إلى باب المنزل
</p>

<h1>سوق مباشر</h1>

<p style="background:#fff3cd;color:#856404;padding:12px;border-radius:8px;font-weight:bold;">
🚚 .الحد الادنى للطلب:100ريال.سعودي
<br>
💵 رسوم التوصيل حسب المنطقة.5او.10.15.او20
</p>

<div id="products"></div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",

authDomain: "rehlattejarah.firebaseapp.com",

projectId: "rehlattejarah",

storageBucket: "rehlattejarah.firebasestorage.app",

messagingSenderId: "56157415045",

appId: "1:56157415045:web:d1c496a5cdc4d5f81e2bec"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const box = document.getElementById("products");
box.innerHTML = "جاري تحميل المنتجات...";

onSnapshot(collection(db,"products"), (snapshot)=>{

box.innerHTML = "";

if(snapshot.empty){

box.innerHTML = "لا توجد منتجات";

return;

}

snapshot.forEach((doc)=>{

const p = doc.data();

box.innerHTML += `

<div class="product">

<div class="name">

${p.اسم || p.name || ""}

</div>

${(p.صورة || p.image) ? `

<img src="${p.صورة || p.image}" alt="صورة المنتج">

` : ""}

<div class="info">

📍 المدينة: ${p.مدينة || p.city || ""}<br>

📞 الهاتف: ${p.هاتف || p.phone || ""}<br>

💰 السعر: ${p.سعر || p.price || ""}
<a href="https://wa.me/${p.هاتف || p.phone}?text=السلام عليكم أريد طلب ${p.اسم || p.name}" target="_blank">
<button>🛒 اطلب الآن</button>
</a>





</div>

</div>

`;

});

}, (error)=>{

box.innerHTML = "تعذر الاتصال بقاعدة البيانات";

console.log(error);

});
  document.getElementById("search").onkeyup = function(){

let text = this.value.toLowerCase();

let items = document.getElementsByClassName("product");

for(let i=0;i<items.length;i++){

if(items[i].innerText.toLowerCase().includes(text)){

items[i].style.display="block";

}else{

items[i].style.display="none";

}

}

};
  </script>

</body>

</html>
