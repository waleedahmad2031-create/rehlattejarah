<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رحلة تجارة من الصفر</title>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#0066cc;
}

#search{
    width:100%;
    padding:12px;
    font-size:18px;
    margin-bottom:20px;
    border-radius:8px;
    border:1px solid #ccc;
}

.product{
    background:white;
    padding:15px;
    margin-bottom:15px;

}

.product img{

    border-radius:8px;
}

.title{
    font-size:22px;

    color:#009933;
}

.info{
    margin-top:8px;
    line-height:1.8;
}
</style>

</head>

<body>

<div id="products">

// البحث

document.getElementById("search").onkeyup=function(){


let value=this.value.toLowerCase();


let items=document.getElementsByClassName("product");


for(let i=0;i<items.length;i++){


if(items[i].innerText.toLowerCase().includes(value)){

}


}


};
