<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سوق مباشر</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:15px;
}

h1{
text-align:center;
color:#198754;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
box-shadow:0 2px 8px #ccc;
text-align:center;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

.price{
color:green;
font-size:20px;
font-weight:bold;
}

button{
background:#198754;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>


<body>

<h1>🛒 سوق مباشر</h1>

<div id="products">
جاري تحميل المنتجات...
</div>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const box=document.getElementById("products");


async function loadProducts(){

box.innerHTML="";

const snap=await getDocs(collection(db,"products"));


snap.forEach(doc=>{

let p=doc.data();


box.innerHTML+=`

<div class="card">

<img src="${p.image || 'https://via.placeholder.com/300'}">


<h3>${p.name}</h3>

<p class="price">
${p.price} ريال
</p>

<p>📍 ${p.city || ""}</p>

<p>الكمية: ${p["الكميه"] || ""}</p>


<button onclick="order('${p.name}')">
اطلب الآن
</button>


</div>

`;

});


}


window.order=function(name){

let msg="السلام عليكم أريد طلب المنتج: "+name;

let phone="966500000000";

window.open(
"https://wa.me/"+phone+"?text="+encodeURIComponent(msg)
);

}


loadProducts();


</script>


</body>
</html>
