<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
color:#198754;
margin-bottom:15px;
font-size:32px;
}

.cart{
display:block;
background:#198754;
color:#fff;
text-decoration:none;
text-align:center;
padding:14px;
border-radius:12px;
font-size:18px;
font-weight:bold;
margin-bottom:20px;
transition:.3s;
}

.cart:hover{
background:#157347;
}

#offers{
background:#fff3cd;
border:2px solid #ffd54f;
border-radius:15px;
padding:15px;
margin:20px 0;
}

#offerProducts{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:15px;
}

#category{
width:100%;
padding:12px;
font-size:16px;
margin:15px 0;
border-radius:10px;
border:1px solid #ccc;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

.card{
background:#fff;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,.12);
transition:.3s;
text-align:center;
padding-bottom:15px;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:250px;
object-fit:contain;
background:#fff;
padding:10px;
}

.card h3{
font-size:19px;
margin:10px;
color:#222;
}

.price{
font-size:22px;
font-weight:bold;
color:#198754;
margin:10px 0;
}

.oldPrice{
color:#999;
text-decoration:line-through;
font-size:16px;
}

button{
width:90%;
padding:12px;
background:#198754;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#157347;
}

</style>

</head>
    <body>

<div style="background:#fff3cd;color:#856404;padding:12px;margin-bottom:15px;border-radius:8px;text-align:center;font-weight:bold;border:1px solid #ffeeba;">
🎉 أهلاً بكم في <b>سوق مباشر</b><br>
📍 الخدمة متوفرة حاليًا في <b>حي منفوحة – الرياض</b>، ونعمل على التوسع قريبًا لخدمة جميع الأحياء.
</div>

<h1>🛒 سوق مباشر</h1>

<p style="text-align:center;color:#198754;font-weight:bold;">
🚚 التوصيل إلى باب بيتك بـ 5 ريال فقط
</p>

<div id="offers">

<h2 style="text-align:center;color:#d63384;">
🔥 عروض اليوم 🔥
</h2>

<div id="offerProducts">
جاري تحميل العروض...
</div>

</div>

<a class="cart" href="cart.html">
🛍️ بعد أن تختار المنتجات اضغط هنا
</a>

<select id="category">

<option value="">📦 جميع الأقسام</option>

<option value="الكتب - المنتجات المكتبية - الألعاب - الأم والطفل">
📚 الكتب - المنتجات المكتبية - الألعاب - الأم والطفل
</option>

<option value="أدوات الحدائق - تحسين المنزل - السيارات">
🏡 أدوات الحدائق - تحسين المنزل - السيارات
</option>

<option value="الإلكترونيات">
💻 الإلكترونيات
</option>

<option value="الأحذية - الحقائب">
👟 الأحذية - الحقائب
</option>

<option value="الإكسسوارات - الساعات - النظارات">
⌚ الإكسسوارات - الساعات - النظارات
</option>

<option value="المنسوجات">
🧵 المنسوجات
</option>

<option value="مستحضرات التجميل - الجمال - العناية الشخصية">
💄 مستحضرات التجميل - الجمال - العناية الشخصية
</option>

<option value="الأثاث">
🛋️ الأثاث
</option>

<option value="السوبرماركت - مستلزمات الحيوانات الأليفة - الصحة">
🛒 السوبرماركت - الخضروات
</option>

<option value="المنسوجات المنزلية - الزينة - المطبخ">
🏠 المنسوجات المنزلية - الزينة - المطبخ
</option>

</select>

<div id="products">
جاري تحميل المنتجات...
</div>
        
<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const box=document.getElementById("products");
const offerBox=document.getElementById("offerProducts");
const categorySelect=document.getElementById("category");

async function loadProducts(){

try{

const snap=await getDocs(collection(db,"products"));

box.innerHTML="";
offerBox.innerHTML="";

const selected=categorySelect.value;

snap.forEach((doc)=>{

const p=doc.data();

const name=p.name || "";
const city=p.city || "";
const image=p.image || "";
const price=p.price || "";
const oldPrice=p.oldPrice || "";
const offer=p.offer || false;
const qty=p.qty || "";
const category=p.category || "";
    if(selected!=="" && category!==selected){
return;
}

if(offer){

offerBox.innerHTML+=`

<div class="card">

<img loading="lazy" src="${image || 'https://via.placeholder.com/500'}">

<h3>${name}</h3>

<p class="oldPrice">${oldPrice} ريال</p>

<p class="price">${price} ريال</p>

<button onclick="addCart('${name}','${price}')">
🛒 أضف للسلة
</button>

</div>

`;

}

box.innerHTML+=`

<div class="card">

<img loading="lazy" src="${image || 'https://via.placeholder.com/500'}">

<h3>${name}</h3>

${offer ? `<p class="oldPrice">${oldPrice} ريال</p>` : ""}

<p class="price">${price} ريال</p>

<p>📂 ${category}</p>

<p>📍 ${city}</p>

<p>📦 الكمية: ${qty}</p>

<button onclick="addCart('${name}','${price}')">
🛒 أضف للسلة
</button>

</div>

`;

});

if(offerBox.innerHTML===""){
offerBox.innerHTML="<p>لا توجد عروض اليوم.</p>";
}

if(box.innerHTML===""){
box.innerHTML="<h3 style='text-align:center;'>لا توجد منتجات في هذا القسم</h3>";
}

}catch(e){

box.innerHTML="حدث خطأ: "+e.message;

}

}

categorySelect.addEventListener("change",loadProducts);

window.addCart=function(name,price){

let cart=JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:name,
price:Number(price)
});

localStorage.setItem("cart",JSON.stringify(cart));

alert("✅ تمت إضافة المنتج إلى السلة");

};

loadProducts();

</script>

</body>

</html>
