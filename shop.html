<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة تجارة من الصفر</title>

<style>

body{
margin:0;
padding:0;
background:#f2f2f2;
font-family:Arial,sans-serif;
}

header{
background:#0066cc;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:700px;
margin:20px auto;
}

.product{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

.product img{
width:100%;
border-radius:10px;
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:bold;
color:#d35400;
}

.whatsapp{
display:block;
background:#25D366;
color:white;
padding:12px;
border-radius:8px;
text-align:center;
text-decoration:none;
margin-top:10px;
}

</style>

</head>

<body>

<header>
رحلة تجارة من الصفر
</header>

<div class="container">

<div id="products">
جاري تحميل المنتجات...
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",

authDomain:"rehlattejarah.firebaseapp.com",

projectId:"rehlattejarah",

storageBucket:"rehlattejarah.firebasestorage.app",

messagingSenderId:"56157415045",

appId:"1:56157415045:web:b009334b4ce5d5331e2bec"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const box=document.getElementById("products");

box.innerHTML="";
  try{

const snapshot=await getDocs(collection(db,"products"));

if(snapshot.empty){

box.innerHTML="<h2>لا توجد منتجات</h2>";

}else{

snapshot.forEach((doc)=>{

const p=doc.data();

box.innerHTML+=`

<div class="product">

<img src="${p.image||''}"
onerror="this.style.display='none'">

<h2>${p.name||''}</h2>

<div class="price">
💰 السعر: ${p.price||''}
</div>

<p>📍 المدينة: ${p.city||''}</p>

<a class="whatsapp"
href="https://wa.me/966${(p.phone||'').replace(/^0/,'')}"
target="_blank">

📱 تواصل عبر واتساب

</a>

</div>

`;

});

}
    catch(error){

console.error(error);

box.innerHTML="<h2>حدث خطأ في تحميل المنتجات</h2>";

}

</script>

</body>
</html>
