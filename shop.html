<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رحلة تجارة من الصفر</title>

<style>

body{
margin:0;
background:#f2f2f2;
font-family:Arial;
}

header{
background:#0066cc;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:700px;
margin:auto;
}

.product{
background:white;
padding:15px;
margin:15px 0;
border-radius:10px;
box-shadow:0 0 8px #ccc;
}

.product img{
width:100%;
border-radius:10px;
}

.price{
color:#d35400;
font-size:22px;
font-weight:bold;
}

.whatsapp{
display:block;
background:#25D366;
color:white;
text-align:center;
padding:12px;
border-radius:8px;
text-decoration:none;
font-size:18px;
}

</style>

</head>

<body>

<header>
رحلة تجارة من الصفر
</header>

<div class="container">

<div id="products">
جاري تحميل المنتجات...
</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",

authDomain: "rehlattejarah.firebaseapp.com",

databaseURL:"https://rehlattejarah-default-rtdb.firebaseio.com",

projectId:"rehlattejarah",

storageBucket:"rehlattejarah.firebasestorage.app",

messagingSenderId:"56157415045",

appId:"1:56157415045:web:d1c496a5cdc4d5f81e2bec"

};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


onValue(ref(db,"products"),(snapshot)=>{

let box=document.getElementById("products");

box.innerHTML="";


snapshot.forEach((item)=>{

let p=item.val();


box.innerHTML+=`

<div class="product">

<img src="${p.image}" onerror="this.style.display='none'">

<h2>${p.name}</h2>

<p class="price">💰 السعر: ${p.price}</p>

<p>📍 المدينة: ${p.city}</p>

<a class="whatsapp"
href="https://wa.me/966${p.phone.substring(1)}"
target="_blank">

تواصل واتساب 📱

</a>

</div>

`;

});


});


</script>

</body>

</html>
