<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.notice{
background:#fff3cd;
color:#856404;
padding:12px;
border-radius:10px;
text-align:center;
margin-bottom:15px;
font-weight:bold;
}

h1{
text-align:center;
color:#198754;
margin-bottom:10px;
font-size:32px;
}

.shipping{
text-align:center;
color:#198754;
font-weight:bold;
margin-bottom:20px;
}

.cart{
display:block;
background:#198754;
color:#fff;
text-decoration:none;
text-align:center;
padding:15px;
border-radius:10px;
font-size:18px;
font-weight:bold;
margin-bottom:20px;
}

#category{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:15px;
}

.card{
background:#fff;
border-radius:12px;
padding:12px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card img{
width:100%;
height:220px;
object-fit:contain;
margin-bottom:10px;
}

.card h3{
margin-bottom:10px;
}

.oldPrice{
text-decoration:line-through;
color:#888;
font-size:16px;
}

.price{
font-size:24px;
font-weight:bold;
color:#198754;
margin:8px 0;
}

.discount{
display:inline-block;
background:#dc3545;
color:#fff;
padding:4px 10px;
border-radius:20px;
margin-bottom:10px;
font-size:14px;
font-weight:bold;
}

button{
width:90%;
padding:12px;
background:#198754;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#157347;
}

</style>

</head>

<body>

<div class="notice">
🎉 أهلاً بكم في <b>سوق مباشر</b><br>
📍 الخدمة متوفرة حالياً في حي منفوحة.
</div>

<h1>🛒 سوق مباشر</h1>

<div class="shipping">
🚚 التوصيل إلى باب بيتك بـ 5 ريال فقط
</div>

<a class="cart" href="cart.html">
🛍️ الذهاب إلى السلة
</a>

<select id="category">

<option value="">📦 جميع الأقسام</option>

<option value="الكتب - المنتجات المكتبية - الألعاب - الأم والطفل">📚 الكتب - المنتجات المكتبية - الألعاب - الأم والطفل</option>

<option value="أدوات الحدائق - تحسين المنزل - السيارات">🏡 أدوات الحدائق - تحسين المنزل - السيارات</option>

<option value="الإلكترونيات">💻 الإلكترونيات</option>

<option value="الأحذية - الحقائب">👟 الأحذية - الحقائب</option>

<option value="الإكسسوارات - الساعات - النظارات">⌚ الإكسسوارات - الساعات - النظارات</option>

<option value="المنسوجات">🧵 المنسوجات</option>

<option value="مستحضرات التجميل - الجمال - العناية الشخصية">💄 مستحضرات التجميل - الجمال - العناية الشخصية</option>

<option value="الأثاث">🛋️ الأثاث</option>

<option value="السوبرماركت - الخضروات">🛒 السوبرماركت - الخضروات</option>

<option value="المنسوجات المنزلية - الزينة - المطبخ">🏠 المنسوجات المنزلية - الزينة - المطبخ</option>

</select>

<div id="products">
جاري تحميل المنتجات...
</div>
  <script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const productsBox = document.getElementById("products");
const category = document.getElementById("category");

async function loadProducts(){

productsBox.innerHTML="";

const snap = await getDocs(collection(db,"products"));

snap.forEach(doc=>{

const p = doc.data();

if(category.value!=="" && p.category!==category.value){
return;
}

productsBox.innerHTML += `

<div class="card">

${p.image ? `<img src="${p.image}" alt="${p.name}">` : ""}

${p.discount>0 ? `<div class="discount">🔥 خصم ${p.discount}%</div>` : ""}

<h3>${p.name}</h3>

${p.discount>0 ? `<div class="oldPrice">${p.oldPrice} ريال</div>` : ""}

<div class="price">${p.price} ريال</div>

<p>📍 ${p.city}</p>

<p>📦 الكمية: ${p.qty}</p>

<button onclick="addCart('${p.name}',${p.price})">
🛒 أضف إلى السلة
</button>

</div>

`;

});

if(productsBox.innerHTML===""){
productsBox.innerHTML="<h3 style='text-align:center'>لا توجد منتجات</h3>";
}

}

category.onchange=loadProducts;

window.addCart=function(name,price){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

cart.push({
name:name,
price:Number(price)
});

localStorage.setItem("cart",JSON.stringify(cart));

alert("✅ تمت إضافة المنتج إلى السلة");

};

loadProducts();

</script>

</body>
</html>
