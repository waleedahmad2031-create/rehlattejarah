<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>سوق مباشر</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#198754;
}

.search{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:20px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 8px #ccc;
text-align:center;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

button{
background:#198754;
color:white;
border:0;
padding:10px;
border-radius:8px;
width:100%;
margin-top:10px;
font-size:16px;
}

.price{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🛒 سوق مباشر</h1>

<input class="search" id="search" placeholder="ابحث عن منتج">

<div class="products" id="products"></div>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let allProducts=[];


async function loadProducts(){

allProducts=[];

let collections=[
"products",
"Products",
"المنتجات",
"المنتجات products"
];


for(let name of collections){

try{

const snap = await getDocs(collection(db,name));


snap.forEach(doc=>{

allProducts.push({

id:doc.id,

...doc.data()

});

});


}catch(error){

console.log(error);

}

}


showProducts(allProducts);

}



function showProducts(list){


let box=document.getElementById("products");

box.innerHTML="";


if(list.length==0){

box.innerHTML="<h3>لا توجد منتجات</h3>";

return;

}



list.forEach(p=>{


let price = p["سعر"] || p.price || 0;


box.innerHTML+=`

<div class="card">


<img src="${p["صورة"] || ''}">


<h3>${p.name || ''}</h3>


<p class="price">${price} ريال</p>


<p>📍 ${p.city || ''}</p>


<p>📦 الكمية: ${p["الكميه"] || ''}</p>


<a href="https://wa.me/966550496391?text=السلام عليكم، أريد طلب ${p.name} بسعر ${price} ريال" target="_blank">
<button>
🟢 اطلب الآن عبر واتساب
</button>
</a>


</div>

`;

});


}



window.addCart=function(id,name,price){


let cart=JSON.parse(localStorage.getItem("cart")) || [];


cart.push({

id:id,

name:name,

price:Number(price),

qty:1

});


localStorage.setItem("cart",JSON.stringify(cart));


alert("تم إضافة المنتج للسلة");


}



document.getElementById("search").oninput=function(){


let text=this.value;


let result=allProducts.filter(p=>

(p.name || "").includes(text)

);


showProducts(result);


}



loadProducts();


</script>


</body>
</html>
