<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة تجارة من الصفر</title>

<style>
body{
margin:0;
padding:0;
background:#f2f2f2;
font-family:Arial,sans-serif;
}

header{
background:#0066cc;
color:#fff;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:700px;
margin:20px auto;
}

.product{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.product img{
width:100%;
height:220px;
object-fit:cover;
border-radius:8px;
margin-bottom:10px;
}

.price{
font-size:22px;
color:#d35400;
font-weight:bold;
}

.city{
margin:8px 0;
}

.whatsapp{
display:block;
text-decoration:none;
background:#25D366;
color:white;
padding:12px;
text-align:center;
border-radius:8px;
margin-top:10px;
font-size:18px;
}

.id{
color:#666;
font-size:15px;
margin-bottom:8px;
}
</style>

</head>

<body>

<header>
رحلة تجارة من الصفر
</header>

<div class="container">

<div id="products">
جاري تحميل المنتجات...
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",

authDomain:"rehlattejarah.firebaseapp.com",

databaseURL:"https://rehlattejarah-default-rtdb.firebaseio.com",

projectId:"rehlattejarah",

storageBucket:"rehlattejarah.firebasestorage.app",

messagingSenderId:"56157415045",

appId:"1:56157415045:web:d1c496a5cdc4d5f81e2bec"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

const box=document.getElementById("products");

onValue(ref(db,"منتجات"),(snapshot)=>{

box.innerHTML="";

if(!snapshot.exists()){

box.innerHTML="<h2>لا توجد منتجات</h2>";

return;

}
  snapshot.forEach((item)=>{

let p=item.val();

box.innerHTML+=`

<div class="product">

<div class="id">
رقم المنتج: ${item.key}
</div>

<img src="${p.image||''}"
onerror="this.style.display='none'">

<h2>${p.name||''}</h2>

<div class="price">
💰 السعر: ${p.price||''}
</div>

<div class="city">
📍 المدينة: ${p.city||''}
</div>

<a class="whatsapp"
href="https://wa.me/${(p.phone||'').replace(/^0/,'966')}"
target="_blank">

تواصل عبر واتساب

</a>

</div>

`;

});

});
  </script>

</body>
</html>
