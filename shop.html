<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سوق مباشر</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:15px;
}

h1{
text-align:center;
color:#198754;
}

.cart{
display:block;
background:#198754;
color:white;
padding:12px;
border-radius:10px;
text-align:center;
text-decoration:none;
margin-bottom:15px;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
box-shadow:0 2px 8px #ccc;
text-align:center;
}

.card img{
    width:100%;
    height:250px;
    object-fit:contain;
    image-rendering:auto;
    border-radius:10px;
    background:#fff;
}

.price{
color:green;
font-size:20px;
font-weight:bold;
}

button{
background:#198754;
color:white;
border:0;
padding:10px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>


<body>

<h1>🛒 سوق مباشر</h1>

<a class="cart" href="cart.html">
🛒 السلة
</a>


<div id="products">
جاري تحميل المنتجات...
</div>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const box=document.getElementById("products");


async function loadProducts(){

try{

const snap=await getDocs(collection(db,"products"));

box.innerHTML="";


snap.forEach((doc)=>{


let p=doc.data();


let name=p.name || "";
let city=p.city || "";
let image=p.image || "";
let price=p.price || "";
let qty=p.qty || "";


box.innerHTML+=`

<div class="card">

<img src="${image || 'https://via.placeholder.com/300'}">

<h3>${name}</h3>

<p class="price">
${price} ريال
</p>

<p>📍 ${city}</p>

<p>الكمية: ${qty}</p>


<button onclick="addCart('${name}','${price}')">
أضف للسلة
</button>


</div>

`;

});


}catch(e){

box.innerHTML="خطأ: "+e.message;

}

}



window.addCart=function(name,price){


let cart=JSON.parse(localStorage.getItem("cart")) || [];


cart.push({

name:name,
price:Number(price)

});


localStorage.setItem("cart",JSON.stringify(cart));


alert("تمت إضافة المنتج للسلة");


}



loadProducts();


</script>


</body>

</html>
