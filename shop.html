<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
color:#198754;
margin-bottom:15px;
font-size:32px;
}

.cart{
display:block;
background:#198754;
color:#fff;
text-decoration:none;
text-align:center;
padding:14px;
border-radius:12px;
font-size:18px;
font-weight:bold;
margin-bottom:20px;
transition:.3s;
}

.cart:hover{
background:#157347;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

.card{
background:#fff;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,.12);
transition:.3s;
text-align:center;
padding-bottom:15px;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:250px;
object-fit:contain;
background:#fff;
padding:10px;
}

.card h3{
font-size:19px;
margin:10px;
color:#222;
}

.price{
font-size:22px;
font-weight:bold;
color:#198754;
margin:10px 0;
}

.card p{
font-size:15px;
color:#666;
margin:6px 0;
}

button{
width:90%;
padding:12px;
background:#198754;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#157347;
}

</style>

</head>

<body>
</head>

<body>

<div style="background:#fff3cd;color:#856404;padding:12px;margin-bottom:15px;border-radius:8px;text-align:center;font-weight:bold;border:1px solid #ffeeba;">
🎉 أهلاً بكم في <b>سوق مباشر</b><br>
📍 الخدمة متوفرة حاليًا في <b>حي منفوحة – الرياض</b>، ونعمل على التوسع قريبًا لخدمة جميع الأحياء.
</div>
<h1>🛒 سوق مباشر</h1>
<p style="text-align:center;color:#198754;font-weight:bold;">
🚚 التوصيل إلى باب بيتك بـ 5 ريال فقط
</p>

<a class="cart" href="cart.html">
🛍️ بعد ان تختار المنتجات اضغط هناء 
</a>

<div id="products">
جاري تحميل المنتجات...
</div>
<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const box=document.getElementById("products");

async function loadProducts(){

try{

const snap=await getDocs(collection(db,"products"));

box.innerHTML="";

snap.forEach((doc)=>{

const p=doc.data();

const name=p.name || "";
const city=p.city || "";
const image=p.image || "";
const price=p.price || "";
const qty=p.qty || "";

box.innerHTML+=`

<div class="card">

<img loading="lazy" src="${image || 'https://via.placeholder.com/500'}" alt="${name}">

<h3>${name}</h3>

<p class="price">${price} ريال</p>

<p>📍 ${city}</p>

<p>📦 الكمية: ${qty}</p>

<button onclick="addCart('${name}','${price}')">
🛒 أضف للسلة
</button>

</div>

`;

});

}catch(e){

box.innerHTML="حدث خطأ: "+e.message;

}

}

window.addCart=function(name,price){

let cart=JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:name,
price:Number(price)
});

localStorage.setItem("cart",JSON.stringify(cart));

alert("✅ تمت إضافة المنتج إلى السلة");

};

loadProducts();

</script>

</body>
</html>
