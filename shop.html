<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة تجارة من الصفر</title>

<style>

body{
margin:0;
background:#f2f2f2;
font-family:Arial,sans-serif;
}

header{
background:#0066cc;
color:#fff;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:700px;
margin:20px auto;
}

.product{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.product img{
width:100%;
height:220px;
object-fit:cover;
border-radius:8px;
margin-bottom:10px;
}

.price{
color:#d35400;
font-size:22px;
font-weight:bold;
}

.city{
color:#555;
margin:8px 0;
}

.whatsapp{
display:block;
background:#25D366;
color:#fff;
text-align:center;
padding:12px;
border-radius:8px;
text-decoration:none;
font-size:18px;
margin-top:10px;
}

</style>

</head>

<body>

<header>
رحلة تجارة من الصفر
</header>

<div class="container">

<div id="products">
جاري تحميل المنتجات...
</div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",
  authDomain: "rehlattejarah.firebaseapp.com",
  databaseURL: "https://rehlattejarah-default-rtdb.firebaseio.com",
  projectId: "rehlattejarah",
  storageBucket: "rehlattejarah.firebasestorage.app",
  messagingSenderId: "56157415045",
  appId: "1:56157415045:web:d1c496a5cdc4d5f81e2bec"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const productsDiv = document.getElementById("products");

onValue(ref(db, "products"), (snapshot) => {

  productsDiv.innerHTML = "";

  if (!snapshot.exists()) {
    productsDiv.innerHTML = "<h3>لا توجد منتجات</h3>";
    return;
  }

  snapshot.forEach((item) => {

    const p = item.val();

    productsDiv.innerHTML += `
      <div class="product">

        <img src="${p.image || ''}" onerror="this.style.display='none'">

        <h2>${p.name || ''}</h2>

        <div class="price">💰 ${p.price || ''}</div>

        <div class="city">📍 ${p.city || ''}</div>

        <a class="whatsapp"
           href="https://wa.me/${(p.phone || '').replace(/\+/g,'')}"
           target="_blank">
           تواصل عبر واتساب
        </a>

      </div>
    `;
  });

});
