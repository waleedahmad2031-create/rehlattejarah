<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوق مباشر</title>
<style>
body{font-family:Tahoma;background:#f5f5f5;margin:0;padding:20px;text-align:center}
#search{width:90%;max-width:400px;padding:10px;font-size:18px}
.product{background:#fff;margin:15px auto;padding:15px;max-width:450px;border-radius:10px;box-shadow:0 0 5px #bbb}
.product img{width:200px;max-width:100%}
button{background:green;color:#fff;border:0;padding:10px 20px;border-radius:8px}
</style>
</head>
<body>
<h1>🛒 سوق مباشر</h1>
<input id="search" placeholder="ابحث عن منتج">
<div id="products"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore,collection,getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={
apiKey:"AIzaSyCt9fXd077nuTZ696hgQaL_gn1vzRY8LHQ",
authDomain:"rehlattejarah.firebaseapp.com",
projectId:"rehlattejarah",
storageBucket:"rehlattejarah.firebasestorage.app",
messagingSenderId:"56157415045",
appId:"1:56157415045:web:d1c496a5cdc4d5f81e2bec"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const box=document.getElementById("products");
let allProducts=[];
function val(p,en,ar){return p[en]??p[ar]??"";}
function render(list){
 box.innerHTML="";
 list.forEach(p=>{
 const name=val(p,"name","اسم");
 const price=val(p,"price","السعر");
 const city=val(p,"city","المدينة");
 const phone=val(p,"phone","الهاتف");
 const image=val(p,"image","الصورة");
 const desc=val(p,"description","الوصف");
 const cat=val(p,"category","القسم")||"أخرى";
 box.innerHTML+=`<div class="product">
 <img src="${image}">
 <h2>${name}</h2>
 <p>💰 السعر: ${price}</p>
 <p>📍 المدينة: ${city}</p>
 <p>📦 القسم: ${cat}</p>
 <p>${desc}</p>
 <a target="_blank" href="https://wa.me/${phone}?text=${encodeURIComponent("السلام عليكم، أريد طلب "+name)}"><button>اطلب الآن</button></a>
 </div>`;
 });
}
async function load(){
 const s=await getDocs(collection(db,"products"));
 allProducts=[];
 s.forEach(d=>allProducts.push(d.data()));
 render(allProducts);
}
document.getElementById("search").addEventListener("input",e=>{
 const t=e.target.value.toLowerCase();
 render(allProducts.filter(p=>JSON.stringify(p).toLowerCase().includes(t)));
});
load();
</script>
</body>
</html>
