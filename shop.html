<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>سوق مباشر | Direct Market</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
text-align:center;
}

h1{
color:green;
}

#search{
width:90%;
max-width:400px;
padding:10px;
font-size:18px;
margin:20px auto;
display:block;
border:1px solid #ccc;
border-radius:8px;
}

.product{
background:#fff;
padding:15px;
margin:15px auto;
max-width:450px;
border-radius:10px;
box-shadow:0 0 5px #bbb;
}

.product img{
width:200px;
max-width:100%;
border-radius:8px;
margin-bottom:10px;
}

.name{
font-size:22px;
font-weight:bold;
color:green;
margin-bottom:10px;
}

.info{
line-height:2;
font-size:18px;
}

</style>

</head>

<body>


<p style="background:green;color:white;padding:12px;border-radius:8px;font-size:20px;font-weight:bold;">

🛒 أهلاً بكم في سوق مباشر  
<br>
Welcome to Direct Market  
<br>
نوصل طلباتكم إلى باب المنزل  
<br>
We deliver your orders to your door

</p>


<h1>
سوق مباشر | Direct Market
</h1>


<input type="text" id="search" placeholder="ابحث عن منتج... Search product">


<div id="products"></div>


<script type="module">
  
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


// ضع بيانات Firebase الخاصة بك هنا

const firebaseConfig = {

apiKey: "ضع apiKey هنا",

authDomain: "ضع authDomain هنا",

projectId: "ضع projectId هنا",

storageBucket: "ضع storageBucket هنا",

messagingSenderId: "ضع messagingSenderId هنا",

appId: "ضع appId هنا"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let productsBox = document.getElementById("products");


async function loadProducts(){


let snapshot = await getDocs(collection(db,"products"));


snapshot.forEach((item)=>{


let p = item.data();


productsBox.innerHTML += `

<div class="product">


<img src="${p.image}">


<div class="name">

${p.name}

</div>


<div class="info">

💰 السعر: ${p.price}

<br>

📍 المدينة: ${p.city}

<br>

📞 الهاتف: ${p.phone}

</div>


<br>


<a href="https://wa.me/${p.phone}?text=السلام عليكم، أريد طلب ${p.name}" target="_blank">


<button style="background:green;color:white;padding:10px;border:0;border-radius:8px;font-size:18px">

🛒 اطلب الآن | Order Now

</button>


</a>


</div>


`;

});


}


loadProducts();
  // البحث عن المنتجات
document.getElementById("search").addEventListener("keyup", function(){

let value = this.value.toLowerCase();

let products = document.getElementsByClassName("product");


for(let i = 0; i < products.length; i++){

let text = products[i].innerText.toLowerCase();


if(text.includes(value)){

products[i].style.display = "block";

}else{

products[i].style.display = "none";
  </script>


</body>

</html>

}

}

});
